[workspace]
members = [
    ".",
    "crates/audio",
    "crates/bible",
    "crates/broadcast",
    "crates/db",
    "crates/detection",
    "crates/stt",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "logos"
version = "0.2.0"
edition = "2024"
authors = ["The Covenant Nation Jesutedo (TCNJ) AI/ML Group"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "logos"
path = "src/main.rs"

[features]
default = ["whisper"]
whisper = ["rhema-stt/whisper"]

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg", "image", "canvas"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
fontdue = "0.9"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
rhema-broadcast = { path = "crates/broadcast" }
rhema-bible = { path = "crates/bible" }
rhema-detection = { path = "crates/detection" }
rhema-stt = { path = "crates/stt" }

[dev-dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }

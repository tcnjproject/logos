[package]
name = "logos"
version = "0.1.3"
edition = "2024"
authors = ["The Covenant Nation Jesutedo (TCNJ) AI/ML Group"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "logos"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg","image", "canvas"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
rhema-broadcast = { path = "crates/broadcast" }
rhema-bible = { path = "crates/bible" }
fontdue = "0.9"
rhema-stt = { path = "crates/stt", features = ["whisper"] }
crossbeam-channel = "0.5"
regex = "1"

[dev-dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
async-trait = "0.1"

[package]
name = "logos"
version = "0.1.0"
edition = "2024"
authors = ["The Covenant Nation Jesutedo (TCNJ) AI/ML Group"]

[[bin]]
name = "logos"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg","image", "canvas"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[package]
name = "lyrics"
version = "0.1.0"
edition = "2021"

[dependencies]
# Microphone capture
cpal = "0.15"
# Whisper bindings (whisper.cpp). Enable "cuda" or "metal" features for GPU.
whisper-rs = "0.16"
# Fuzzy matching of transcription against known lyric lines
strsim = "0.11"
# Web display server (SSE to a browser / projector)
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# Misc
anyhow = "1"
crossbeam-channel = "0.5"

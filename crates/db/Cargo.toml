[package]
name = "build_bible_db"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "build_bible_db"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
phf = { version = "0.11", features = ["macros"] }
anyhow = "1"
